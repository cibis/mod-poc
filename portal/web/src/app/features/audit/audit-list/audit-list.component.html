<div class="page-header"><h1>Audit Log</h1></div>

<form [formGroup]="filters" class="filter-bar">
  <mat-form-field><mat-label>Tenant ID</mat-label><input matInput formControlName="tenantId" /></mat-form-field>
  <mat-form-field><mat-label>From (ISO)</mat-label><input matInput formControlName="from" /></mat-form-field>
  <mat-form-field><mat-label>To (ISO)</mat-label><input matInput formControlName="to" /></mat-form-field>
  <mat-form-field><mat-label>Action</mat-label><input matInput formControlName="action" /></mat-form-field>
  <button mat-stroked-button (click)="load()"><mat-icon>search</mat-icon></button>
</form>

@if (loading()) {
  <mat-spinner diameter="40" />
} @else if (error()) {
  <p class="error-msg">{{ error() }}</p>
} @else {
  <table mat-table [dataSource]="items()" class="full-width mat-elevation-z2">
    <ng-container matColumnDef="performedAt">
      <th mat-header-cell *matHeaderCellDef>When</th>
      <td mat-cell *matCellDef="let e">{{ e.performedAt | slice:0:19 }}</td>
    </ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let e">{{ e.action }}</td>
    </ng-container>
    <ng-container matColumnDef="actor">
      <th mat-header-cell *matHeaderCellDef>Actor</th>
      <td mat-cell *matCellDef="let e">{{ e.actor }}</td>
    </ng-container>
    <ng-container matColumnDef="tenantId">
      <th mat-header-cell *matHeaderCellDef>Tenant</th>
      <td mat-cell *matCellDef="let e">{{ e.tenantId ?? '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="details">
      <th mat-header-cell *matHeaderCellDef>Details</th>
      <td mat-cell *matCellDef="let e">{{ e.details ?? '' }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>
  <mat-paginator [length]="total()" [pageSize]="pageSize()" [pageSizeOptions]="[25,50,100]" (page)="onPage($event)" />
}
