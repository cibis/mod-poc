<div class="page-header"><h1>Restatements</h1></div>

<form [formGroup]="filters" class="filter-bar">
  <mat-form-field><mat-label>Tenant ID</mat-label><input matInput formControlName="tenantId" /></mat-form-field>
  <mat-form-field><mat-label>From (ISO)</mat-label><input matInput formControlName="from" /></mat-form-field>
  <mat-form-field><mat-label>To (ISO)</mat-label><input matInput formControlName="to" /></mat-form-field>
  <button mat-stroked-button (click)="load()"><mat-icon>search</mat-icon></button>
</form>

@if (loading()) {
  <mat-spinner diameter="40" />
} @else if (error()) {
  <p class="error-msg">{{ error() }}</p>
} @else {
  <table mat-table [dataSource]="items()" class="full-width mat-elevation-z2">
    <ng-container matColumnDef="minuteAt">
      <th mat-header-cell *matHeaderCellDef>Minute</th>
      <td mat-cell *matCellDef="let r">{{ r.minuteAt | slice:0:19 }}</td>
    </ng-container>
    <ng-container matColumnDef="assetName">
      <th mat-header-cell *matHeaderCellDef>Asset</th>
      <td mat-cell *matCellDef="let r">{{ r.assetName }}</td>
    </ng-container>
    <ng-container matColumnDef="lineName">
      <th mat-header-cell *matHeaderCellDef>Line</th>
      <td mat-cell *matCellDef="let r">{{ r.lineName }}</td>
    </ng-container>
    <ng-container matColumnDef="siteName">
      <th mat-header-cell *matHeaderCellDef>Site</th>
      <td mat-cell *matCellDef="let r">{{ r.siteName }}</td>
    </ng-container>
    <ng-container matColumnDef="eventCount">
      <th mat-header-cell *matHeaderCellDef>Events</th>
      <td mat-cell *matCellDef="let r">{{ r.eventCount }}</td>
    </ng-container>
    <ng-container matColumnDef="lastComputedAt">
      <th mat-header-cell *matHeaderCellDef>Last Computed</th>
      <td mat-cell *matCellDef="let r">{{ r.lastComputedAt | slice:0:19 }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>
  <mat-paginator [length]="total()" [pageSize]="pageSize()" [pageSizeOptions]="[25,50,100]" (page)="onPage($event)" />
}
