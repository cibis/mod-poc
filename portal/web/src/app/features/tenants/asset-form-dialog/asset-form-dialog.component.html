<h2 mat-dialog-title>Add Asset</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field class="full-width"><mat-label>Name</mat-label><input matInput formControlName="name" /></mat-form-field>
    <mat-form-field class="full-width"><mat-label>Asset Type</mat-label><input matInput formControlName="assetType" /></mat-form-field>
    <mat-form-field class="full-width"><mat-label>Process Value Name</mat-label><input matInput formControlName="processValueName" /></mat-form-field>
    <mat-form-field class="full-width"><mat-label>Process Value Unit</mat-label><input matInput formControlName="processValueUnit" /></mat-form-field>
    <mat-form-field class="full-width"><mat-label>Min Value</mat-label><input matInput type="number" formControlName="processValueMin" /></mat-form-field>
    <mat-form-field class="full-width"><mat-label>Max Value</mat-label><input matInput type="number" formControlName="processValueMax" /></mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid">Add</button>
</mat-dialog-actions>
